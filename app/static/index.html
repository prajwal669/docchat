<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317203a'/%3E%3Cpath d='M9 7h14v13H9z' fill='%23ffe066'/%3E%3Cpath d='M9 24h14' stroke='%23ffe066' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17203a;
    --ink-soft: #2a3556;
    --paper: #f3f5f8;
    --card: #ffffff;
    --rule: #d9dee6;
    --muted: #5a6478;
    --marker: #ffe066;
    --marker-soft: #fff3b8;
    --link: #2447d6;
    --danger: #b3261e;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 4px; }

  .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

  /* ---- Library (left spine) ---- */
  .library {
    background: var(--ink); color: #e9edf7; padding: 28px 22px;
    display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .tagline { margin: -8px 0 0; color: #aeb8d0; font-size: 14px; max-width: 26ch; }

  .drop {
    width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 1.5px dashed #5d6b92; border-radius: 10px;
    padding: 16px; color: #e9edf7; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--marker); background: rgba(255, 224, 102, .07); }
  .drop strong { display: block; font-weight: 600; }
  .drop span { color: #aeb8d0; font-size: 13px; }

  .demo .drop, .demo .icon-btn { display: none; }
  .demo-note { color: #aeb8d0; font-size: 13.5px; margin: 0; max-width: 28ch; }

  .docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .doc { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px;
         padding: 8px 6px; border-radius: 8px; }
  .doc:hover { background: rgba(255, 255, 255, .06); }
  .doc input { accent-color: var(--marker); width: 16px; height: 16px; margin: 0; }
  .doc label { min-width: 0; cursor: pointer; }
  .doc .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .doc .meta { display: block; font-size: 12.5px; color: #aeb8d0; }
  .icon-btn { background: none; border: 0; padding: 6px 8px; border-radius: 6px; color: #aeb8d0; cursor: pointer; }
  .icon-btn:hover { color: #fff; background: rgba(255, 255, 255, .12); }

  .library-empty { color: #aeb8d0; font-size: 14px; margin: 0; }
  .link-btn { background: none; border: 0; padding: 0; color: var(--marker); text-decoration: underline;
              text-underline-offset: 3px; cursor: pointer; text-align: left; }
  .spacer { flex: 1; }

  details.settings { border-top: 1px solid #34406a; padding-top: 14px; font-size: 14px; }
  details.settings summary { cursor: pointer; color: #c9d1e6; }
  .field { display: grid; gap: 4px; margin-top: 12px; }
  .field label { color: #aeb8d0; font-size: 13px; }
  .field select, .field input[type=number] {
    background: var(--ink-soft); border: 1px solid #44507c; border-radius: 8px; padding: 7px 10px; color: #fff;
  }
  .hint { color: #8f9bbb; font-size: 12.5px; margin: 6px 0 0; }

  /* ---- Desk (main) ---- */
  .desk { display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
  .thread { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 40px 28px 24px; }

  .welcome h2 { font-family: var(--serif); font-size: 40px; line-height: 1.1; font-weight: 500;
                letter-spacing: -0.015em; margin: 12px 0 14px; max-width: 18ch; }
  .welcome p { font-family: var(--serif); font-size: 19px; color: var(--muted); max-width: 52ch; margin: 0 0 22px; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starter { background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
             padding: 8px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .starter:hover { border-color: var(--ink); background: #fff; }

  .turn { margin: 0 0 44px; }
  .q { font-weight: 600; font-size: 16px; margin: 0 0 12px; max-width: 62ch; }
  .answer { font-family: var(--serif); font-size: 20px; line-height: 1.6; max-width: 66ch; margin: 0 0 6px; }
  .answer.abstain { color: var(--muted); font-style: italic; }
  .cite {
    font: 600 12px/1 var(--sans); background: var(--marker); color: var(--ink); border: 0;
    padding: 3px 6px 3px; margin: 0 2px; border-radius: 4px; cursor: pointer; vertical-align: 2px;
  }
  .cite:hover { background: #ffd633; }
  .stats { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .notice { background: var(--marker-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin: 8px 0 14px; max-width: 66ch; }

  .sources { display: grid; gap: 8px; max-width: 66ch; }
  .sources h3 { margin: 10px 0 0; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .source { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; }
  .source[open] { border-color: #b7c0d0; }
  .source summary { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; list-style: none; }
  .source summary::-webkit-details-marker { display: none; }
  .tab { background: var(--marker); font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 4px 4px 0 0;
         border-bottom: 3px solid #e6c200; white-space: nowrap; }
  .source .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .source .score { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .excerpt { font-family: var(--serif); font-size: 17px; line-height: 1.65; margin: 0; padding: 4px 18px 16px; color: #28324d; }
  .excerpt mark { background: var(--marker); color: inherit; padding: 0 1px; border-radius: 2px; }
  .source.flash { animation: flash 1.1s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 4px var(--marker); } to { box-shadow: 0 0 0 4px transparent; } }

  .pending { color: var(--muted); font-family: var(--serif); font-size: 19px; }
  .pending::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%;
                    background: var(--ink); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }

  .error { color: var(--danger); font-weight: 500; }

  /* ---- Ask bar ---- */
  .askbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--paper) 70%, rgba(243, 245, 248, 0)); padding: 18px 28px 26px; }
  .ask { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; }
  .ask input {
    flex: 1; min-width: 0; background: var(--card); border: 1.5px solid var(--rule); border-radius: 12px;
    padding: 14px 16px; font-size: 16px;
  }
  .ask input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(23, 32, 58, .15); }
  .ask button {
    background: var(--ink); color: #fff; border: 0; border-radius: 12px; padding: 0 22px; font-weight: 600; cursor: pointer;
  }
  .ask button:hover:not(:disabled) { background: var(--ink-soft); }
  .ask button:disabled, .ask input:disabled { opacity: .55; cursor: not-allowed; }

  .toast { position: fixed; right: 18px; top: 18px; max-width: 360px; background: #fff; border: 1px solid var(--rule);
           border-left: 4px solid var(--danger); border-radius: 8px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(23, 32, 58, .18); }
  .toast[hidden] { display: none; }
  .toast.ok { border-left-color: #2e7d32; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .library { position: static; height: auto; padding: 20px 18px; }
    .desk { min-height: 0; }
    .thread { padding: 24px 18px 12px; }
    .askbar { padding: 14px 18px 20px; }
    .welcome h2 { font-size: 32px; }
    .answer { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="library" aria-label="Your documents">
    <h1 class="brand">DocChat</h1>
    <p class="tagline">Ask questions about your documents and see the exact page each answer came from.</p>

    <button type="button" class="drop" id="drop">
      <strong>Add documents</strong>
      <span>Drop PDF, TXT or MD files here, or click to choose.</span>
    </button>
    <input type="file" id="file" multiple accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown" hidden>

    <p class="demo-note" id="demo-note" hidden>This is a public demo with sample documents. Run DocChat on your own computer to ask about your own files.</p>
    <ul class="docs" id="docs" aria-label="Documents"></ul>
    <p class="library-empty" id="library-empty" hidden>
      No documents yet. <button type="button" class="link-btn" id="samples">Load the sample documents</button> to try it out.
    </p>

    <div class="spacer"></div>

    <details class="settings">
      <summary>Search settings</summary>
      <div class="field">
        <label for="retriever">Retrieval method</label>
        <select id="retriever"></select>
      </div>
      <div class="field">
        <label for="topk">Passages to retrieve</label>
        <input type="number" id="topk" min="1" max="10" value="4">
      </div>
      <p class="hint" id="engine-hint"></p>
    </details>
  </aside>

  <main class="desk">
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="askbar">
      <form class="ask" id="ask" autocomplete="off">
        <input id="question" type="text" maxlength="1000" placeholder="Ask a question about your documents" aria-label="Your question">
        <button type="submit" id="send">Ask</button>
      </form>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="alert" hidden></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const state = { docs: [], selected: new Set(), busy: false };
  const SAMPLE_QUESTIONS = [
    "How many days of paid leave does a Northwind employee get?",
    "How long does Fabrikam take to pay contractor invoices?",
    "How do I undo the last commit but keep my changes staged?",
    "How much water do vegetable beds need each week?",
    "Which debt payoff method saves the most interest?",
  ];
  const STOP = new Set(("a an and are as at be by can do does for from how i if in is it of on or so that the " +
    "their there they this to was we what when where which who why will with you your much many long get each every").split(" "));

  // ---------- helpers ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of children) node.append(c);
    return node;
  }
  let toastTimer;
  function toast(message, ok = false) {
    const t = $("toast");
    t.textContent = message; t.className = "toast" + (ok ? " ok" : ""); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
  }
  async function api(path, options) {
    let res;
    try { res = await fetch(path, options); }
    catch { throw new Error("Could not reach the server. Check your connection and try again."); }
    let body = null;
    try { body = await res.json(); } catch { /* non-JSON error body */ }
    if (!res.ok) {
      let detail = body && body.detail;
      if (Array.isArray(detail)) detail = "Please check your question and try again.";
      const err = new Error(detail || `Request failed (${res.status}).`);
      err.body = body; err.status = res.status; throw err;
    }
    return body;
  }
  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function queryTerms(question) {
    const words = question.toLowerCase().match(/[a-z0-9]+/g) || [];
    const out = new Set();
    for (const w of words) {
      if (w.length < 3 || STOP.has(w)) continue;
      out.add(w.length > 5 ? w.replace(/(ing|ed|es|s)$/, "") : w);
    }
    return [...out];
  }
  function highlight(text, terms) {
    const frag = document.createDocumentFragment();
    if (!terms.length) { frag.append(text); return frag; }
    const re = new RegExp("\\b(?:" + terms.map(escapeRe).join("|") + ")[a-z0-9]*", "gi");
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      frag.append(el("mark", { text: m[0] }));
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.append(text.slice(last));
    return frag;
  }

  // ---------- library ----------
  function renderDocs() {
    const list = $("docs");
    list.replaceChildren();
    for (const d of state.docs) {
      const cb = el("input", { type: "checkbox", id: "doc-" + d.id, "aria-label": "Search " + d.name });
      cb.checked = state.selected.has(d.id);
      cb.addEventListener("change", () => { cb.checked ? state.selected.add(d.id) : state.selected.delete(d.id); });
      const label = el("label", { for: "doc-" + d.id, title: d.name },
        el("span", { class: "name", text: d.name.replace(/\.[^.]+$/, "").replace(/_/g, " ") }),
        el("span", { class: "meta", text: `${d.pages} ${d.pages === 1 ? "page" : "pages"}` }));
      const del = el("button", { type: "button", class: "icon-btn", "aria-label": "Remove " + d.name, title: "Remove" , text: "Remove" });
      del.addEventListener("click", () => removeDoc(d));
      list.append(el("li", { class: "doc" }, cb, label, del));
    }
    $("library-empty").hidden = state.docs.length > 0;
    renderWelcome();
  }
  async function refreshDocs() {
    state.docs = await api("/api/documents");
    const ids = new Set(state.docs.map((d) => d.id));
    for (const id of [...state.selected]) if (!ids.has(id)) state.selected.delete(id);
    return ids;
  }
  async function loadDocs(selectNew = true) {
    const before = new Set(state.docs.map((d) => d.id));
    await refreshDocs();
    for (const d of state.docs) if (selectNew && !before.has(d.id)) state.selected.add(d.id);
    renderDocs();
  }
  async function uploadFiles(fileList) {
    const files = [...fileList];
    if (!files.length) return;
    const form = new FormData();
    files.forEach((f) => form.append("files", f));
    const drop = $("drop"); drop.disabled = true;
    drop.querySelector("strong").textContent = "Reading documents";
    try {
      let body;
      try { body = await api("/api/documents", { method: "POST", body: form }); }
      catch (e) { if (e.body && e.body.results) body = e.body; else throw e; }
      const errors = body.results.filter((r) => r.status === "error");
      const added = body.results.filter((r) => r.status === "added").length;
      await loadDocs(true);
      if (errors.length) toast(errors.map((r) => `${r.name}: ${r.error}`).join("\n"));
      else toast(added ? `Added ${added} ${added === 1 ? "document" : "documents"}.` : "Those documents were already added.", true);
    } catch (e) { toast(e.message); }
    finally { drop.disabled = false; drop.querySelector("strong").textContent = "Add documents"; }
  }
  async function removeDoc(d) {
    if (!confirm(`Remove "${d.name}"? Its text will be deleted from this app.`)) return;
    try { await api("/api/documents/" + d.id, { method: "DELETE" }); await loadDocs(false); }
    catch (e) { toast(e.message); }
  }
  async function loadSamples() {
    try { await api("/api/documents/samples", { method: "POST" }); await loadDocs(true); toast("Sample documents added.", true); }
    catch (e) { toast(e.message); }
  }

  // ---------- conversation ----------
  function renderWelcome() {
    const thread = $("thread");
    const existing = thread.querySelector(".welcome");
    if (thread.querySelector(".turn")) { existing && existing.remove(); return; }
    const hasSamples = state.docs.some((d) => d.name === "Northwind_Employee_Handbook.pdf");
    const box = el("section", { class: "welcome" });
    if (!state.docs.length) {
      box.append(el("h2", { text: "Add a document, then ask it anything." }),
        el("p", { text: "Answers come with the page they were taken from, so you can check them against the source." }));
    } else {
      box.append(el("h2", { text: "What would you like to know?" }),
        el("p", { text: "Every answer is built from passages in your documents, and each one is cited by page." }));
      if (hasSamples) {
        const row = el("div", { class: "starters" });
        for (const q of SAMPLE_QUESTIONS) {
          row.append(el("button", { type: "button", class: "starter", text: q, onclick: () => { $("question").value = q; ask(); } }));
        }
        box.append(row);
      }
    }
    existing ? existing.replaceWith(box) : thread.append(box);
  }

  function renderAnswer(turn, data, question) {
    const terms = queryTerms(question);
    const answer = el("p", { class: "answer" + (data.abstained ? " abstain" : "") });
    const cited = new Set();
    const parts = data.answer.split(/(\[\d+\])/g);
    for (const part of parts) {
      const m = /^\[(\d+)\]$/.exec(part);
      if (m && !data.abstained) {
        const n = Number(m[1]); cited.add(n);
        answer.append(el("button", { type: "button", class: "cite", "aria-label": "Show source " + n, text: String(n),
          onclick: () => openSource(turn, n) }));
      } else if (part) answer.append(part);
    }
    const nodes = [answer];

    if (data.warning) nodes.push(el("p", { class: "notice", text: data.warning }));
    if (data.abstained) {
      nodes.push(el("p", { class: "stats", text: "Try rewording the question, or add the document that covers this topic." }));
    } else {
      const engine = data.answerer === "extractive" ? "by selecting the best-matching sentences" : "with " + data.answerer;
      nodes.push(el("p", { class: "stats", text: `Answered ${engine} in ${Math.round(data.latency_ms)} ms.` }));
    }

    const byN = new Map(data.citations.map((c) => [c.n, c]));
    const makeSource = (c, open) => {
      const d = el("details", { class: "source", id: `${turn.id}-src-${c.n}` });
      d.open = open;
      d.append(el("summary", {},
        el("span", { class: "tab", text: "p. " + c.page }),
        el("span", { class: "where", text: `${c.doc_name.replace(/\.[^.]+$/, "").replace(/_/g, " ")} (source ${c.n})` })));
      d.append(el("p", { class: "excerpt" }, highlight(c.text, terms)));
      return d;
    };
    const citedList = [...cited].filter((n) => byN.has(n)).sort((a, b) => a - b);
    const others = data.citations.filter((c) => !cited.has(c.n));
    if (citedList.length || others.length) {
      const wrap = el("div", { class: "sources" });
      if (citedList.length) { wrap.append(el("h3", { text: "Sources cited in the answer" })); citedList.forEach((n) => wrap.append(makeSource(byN.get(n), true))); }
      if (others.length) { wrap.append(el("h3", { text: citedList.length ? "Also retrieved" : "Closest passages found" })); others.forEach((c) => wrap.append(makeSource(c, false))); }
      nodes.push(wrap);
    }
    turn.body.replaceChildren(...nodes);
  }
  function openSource(turn, n) {
    const d = document.getElementById(`${turn.id}-src-${n}`);
    if (!d) return;
    d.open = true; d.scrollIntoView({ behavior: "smooth", block: "nearest" });
    d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash");
  }

  let turnCounter = 0;
  async function ask() {
    const input = $("question");
    const question = input.value.trim();
    if (state.busy) return;
    if (question.length < 3) { toast("Type a question of at least 3 characters."); return; }
    if (!state.docs.length) { toast("Add a document first, or load the samples."); return; }
    if (!state.selected.size) { toast("Select at least one document to search."); return; }

    state.busy = true; $("send").disabled = true; input.disabled = true;
    const thread = $("thread");
    thread.querySelector(".welcome")?.remove();
    const turn = { id: "t" + (++turnCounter), body: el("div", {}, el("p", { class: "pending", text: "Searching your documents" })) };
    const section = el("section", { class: "turn" }, el("p", { class: "q", text: question }), turn.body);
    thread.append(section);
    section.scrollIntoView({ behavior: "smooth", block: "start" });

    const payload = { question, top_k: Number($("topk").value) || 4, retriever: $("retriever").value };
    if (state.selected.size < state.docs.length) payload.doc_ids = [...state.selected];
    try {
      const data = await api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      input.value = "";
      renderAnswer(turn, data, question);
    } catch (e) {
      turn.body.replaceChildren(el("p", { class: "error", text: e.message }));
      if (e.status === 404) loadDocs(false).catch(() => {});
    } finally {
      state.busy = false; $("send").disabled = false; input.disabled = false; input.focus();
    }
  }

  // ---------- wiring ----------
  $("ask").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
  $("samples").addEventListener("click", loadSamples);
  const drop = $("drop"), fileInput = $("file");
  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { uploadFiles(fileInput.files); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  (async () => {
    try {
      const health = await api("/api/health");
      const LABELS = { hybrid: "Hybrid (keyword + semantic)", bm25: "Keyword (BM25)", tfidf: "TF-IDF",
        lsa: "Semantic (LSA)", dense: "Embeddings", hybrid_dense: "Hybrid (keyword + embeddings)" };
      const select = $("retriever");
      for (const name of health.retrievers) select.append(el("option", { value: name, text: LABELS[name] || name }));
      select.value = health.default_retriever;
      if (health.demo_mode) { document.body.classList.add("demo"); $("demo-note").hidden = false; }
      $("engine-hint").textContent = health.answerer === "extractive"
        ? "Answers are assembled from matching sentences. Set ANTHROPIC_API_KEY on the server for written answers."
        : "Answers are written by " + health.answerer + ", using only the retrieved passages.";
      await loadDocs(true);
    } catch (e) { toast(e.message); renderDocs(); }
    $("question").focus();
  })();
})();
</script>
</body>
</html>
